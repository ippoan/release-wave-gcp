name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# go-ci.yml は内部に `disable-auto-merge` job (`pull-requests: write` 要求) を
# 持つ。`id-token: write` は secret-verify 併用予定なら必要 (= 現状は宣言だけ
# しておけば後で input を埋めれば動く)。Cloud Run deploy job を後で足す時に
# `packages: write` も追加する。
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/go-ci.yml@main
    with:
      test_args: './... -race'

  # GHCR への image push。`ci` の vet/test/build/coverage gate 全 success 後に走る。
  # deploy 経路は GCP setup (WIF / runtime SA / Cloud Run service / Secret) が
  # 整い次第、後続 PR で `deploy-staging` job を追加する。
  build-image:
    if: github.event.pull_request.draft != true
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ippoan/release-wave-gcp:${{ steps.meta.outputs.tag }}
            ghcr.io/ippoan/release-wave-gcp:latest

  # staging deploy: ci-workflows の cloud-run-deploy.yml reusable を呼ぶ。
  # AR remote-repo `cloudsql-sv/ghcr` (pull-through cache) 経由で digest pin
  # した image を Cloud Run staging service に流す。
  #
  # Auth は WIF (Workload Identity Federation + GitHub OIDC trust)。GCP_SA_KEY
  # secret は使わない (= runtime / deploy 両側で GCP key 0 個を維持)。
  #
  # service は初回のみ手動作成済み (reusable は `gcloud run services update`
  # = service 既存前提)。以降は本 job が image digest を bump する。
  # `update_secrets` で `RELEASE_WAVE_API_KEY` を Secret Manager の
  # `RELEASE_WAVE_GCP_API_KEY`(= ci-dashboard handler が送る GitHub org secret
  # と同値) に bind する。値は workflow / log を一切経由しない (secretKeyRef)。
  #
  # vars (`GCP_WIF_PROVIDER` / `GCP_WIF_SERVICE_ACCOUNT_STAGING`) が空の間は
  # `if:` で skip され、PR の check は `ci` / `build-image` だけで通る。
  deploy-staging:
    name: Deploy (staging)
    needs: [ci, build-image]
    if: >-
      github.event.pull_request.draft != true &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_WIF_SERVICE_ACCOUNT_STAGING != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ippoan/ci-workflows/.github/workflows/cloud-run-deploy.yml@main
    with:
      service: release-wave-gcp-staging
      region: asia-northeast1
      project: cloudsql-sv
      ghcr_image: ghcr.io/ippoan/release-wave-gcp
      image_tag: ${{ needs.build-image.outputs.image_tag }}
      ar_repo: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr/ippoan/release-wave-gcp
      workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
      update_secrets: RELEASE_WAVE_API_KEY=RELEASE_WAVE_GCP_API_KEY:latest

  # 全 CI job (= ci / build-image / deploy-staging) が success / skipped した
  # 時だけ ci-workflows の auto-merge.yml reusable を呼んで PR auto-merge を enable。
  # 内部実装は `gh pr merge --auto --squash` (= GitHub-native auto-merge を queue)。
  #
  # go-ci.yml が内蔵する disable-auto-merge job との対 (= dual-step pattern):
  #   - PR open 時: disable-auto-merge が走り、人が enable してた auto-merge を即 disable
  #   - 全 CI success 後: 本 job が走り auto-merge を再 enable → merge queue
  #
  # `needs:` が success 評価された時点で本 job が動くため、branch protection の
  # required check 設定が空でも、ここに来た時点で「全 CI green が確定」している
  # (= secrets-inventory-gcp#21 のような CI fail 中の誤 merge は起きない)。
  # deploy-staging は vars 未設定時 skip されるので `|| skipped` も許容する。
  auto-merge:
    name: Auto Merge
    needs: [ci, build-image, deploy-staging]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.ci.result == 'success' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    # auto-merge.yml は CI_APP_ID / CI_APP_PRIVATE_KEY (org secret, GitHub App)
    # で installation token を mint する。github.token fallback は撤去された
    # (ci-workflows#65) ため、この 2 secret が無いと CI_APP_ID 空で fail する。
    # least-privilege: secrets: inherit (全 secret 渡し) でなく必要な 2 つだけ named で渡す。
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
