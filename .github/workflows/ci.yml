name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: write   # build-image で GHCR push に必要

jobs:
  # secrets-inventory-gcp と同じ「PR auto-merge を CI 開始時に強制 disable」
  # pattern。branch protection の required check 不揃いで CI green 前に
  # merge される事故 (ippoan/secrets-inventory-gcp#21) を防ぐ。
  disable-auto-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Force-disable PR auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --disable-auto "$PR_NUMBER" -R "$REPO" || true

  ci:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: go build
        run: go build -trimpath ./...

  # GHCR への image push。non-draft PR で走る。deploy 経路は GCP setup
  # (WIF / service / runtime SA / secret) が整い次第 後続 PR で追加する。
  build-image:
    if: github.event.pull_request.draft != true
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ippoan/release-wave-gcp:${{ steps.meta.outputs.tag }}
            ghcr.io/ippoan/release-wave-gcp:latest

  # Cloud Run deploy は GCP setup (WIF provider, deployer SA, runtime SA,
  # Cloud Run service の初回作成、Secret Manager `RELEASE_WAVE_GCP_API_KEY*`
  # 投入) が完了次第、後続 PR で `deploy-staging` job を追加する。
  # 現時点では vet/test/build + image push のみ。
