name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# go-ci.yml は内部に `disable-auto-merge` job (`pull-requests: write` 要求) を
# 持つ。`id-token: write` は secret-verify 併用予定なら必要 (= 現状は宣言だけ
# しておけば後で input を埋めれば動く)。Cloud Run deploy job を後で足す時に
# `packages: write` も追加する。
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/go-ci.yml@main
    with:
      test_args: './... -race'

  # GHCR への image push。`ci` の vet/test/build/coverage gate 全 success 後に走る。
  # deploy 経路は GCP setup (WIF / runtime SA / Cloud Run service / Secret) が
  # 整い次第、後続 PR で `deploy-staging` job を追加する。
  build-image:
    if: github.event.pull_request.draft != true
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ippoan/release-wave-gcp:${{ steps.meta.outputs.tag }}
            ghcr.io/ippoan/release-wave-gcp:latest
